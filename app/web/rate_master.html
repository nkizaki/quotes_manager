<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>賃率マスタ編集</title>
  <link rel="icon" type="image/png" sizes="256x256" href="icons/icon.ico">
  <link rel="stylesheet" href="css/top.css">
  <link rel="stylesheet" href="css/design.css">
  <link rel="stylesheet" href="css/app-theme.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/rate_master.css">
  <link rel="stylesheet" href="css/quotes.css">
  <script src="js/font_size_pref.js"></script>
  <script src="js/font_scale_boot.js"></script>
</head>
<body class="rate-master-page">
  <header class="search-header ship-insp-header-bar rate-master-header">
    <div class="search-header-inner ship-insp-sub-header-inner quotes-header-inner">
      <a href="edit_masters.html" class="ship-insp-back-btn">戻る</a>
      <h1 class="search-header-title rate-master-title">賃率マスタ編集</h1>
      <span class="search-header-version" id="app-version"></span>
      <span id="app-dev-badge" hidden style="color: red; font-weight: bold;">開発モード</span>
    </div>
  </header>

  <main class="rate-master-main">
    <p id="rate-master-message" class="rate-master-message" aria-live="polite"></p>

    <div class="rate-master-table-wrap">
      <table class="rate-master-table" id="rate-master-table">
        <!-- 列幅は rate_master.css の --rm-table-col-* で個別指定 -->
        <colgroup>
          <col class="rm-col rm-col--id" />
          <col class="rm-col rm-col--koubun" />
          <col class="rm-col rm-col--setsubi" />
          <col class="rm-col rm-col--roumu" />
          <col class="rm-col rm-col--yu" />
          <col class="rm-col rm-col--denki" />
          <col class="rm-col rm-col--setsubihi" />
          <col class="rm-col rm-col--tateya" />
          <col class="rm-col rm-col--tochi" />
          <col class="rm-col rm-col--goukei" />
        </colgroup>
        <thead>
          <tr id="rate-master-thead-row"></tr>
        </thead>
        <tbody id="rate-master-tbody"></tbody>
      </table>
    </div>

    <section class="rate-master-form-section" aria-labelledby="rate-master-form-title">
      <h2 id="rate-master-form-title" class="rate-master-form-heading">入力</h2>
      <div class="rate-master-form-grid">
        <!-- 入力欄の幅は rate_master.css の --rm-form-* で個別指定 -->
        <div class="rate-master-field rate-master-field--id">
          <label for="rm-id">ID</label>
          <input type="text" id="rm-id" name="rm_id" autocomplete="off" placeholder="（新規時は空）">
        </div>
        <div class="rate-master-field rate-master-field--koubun">
          <label for="rm-koubun">工程分類</label>
          <input type="text" id="rm-koubun" name="rm_koubun" autocomplete="off">
        </div>
        <div class="rate-master-field rate-master-field--setsubi">
          <label for="rm-setsubi">設備名等</label>
          <input type="text" id="rm-setsubi" name="rm_setsubi" autocomplete="off">
        </div>
        <div class="rate-master-field rate-master-field--roumu">
          <label for="rm-roumu">労務費率</label>
          <input type="text" id="rm-roumu" class="rate-master-num-input" inputmode="decimal" autocomplete="off" placeholder="0.000">
        </div>
        <div class="rate-master-field rate-master-field--yu">
          <label for="rm-yu">油等賃率</label>
          <input type="text" id="rm-yu" class="rate-master-num-input" inputmode="decimal" autocomplete="off" placeholder="0.000">
        </div>
        <div class="rate-master-field rate-master-field--denki">
          <label for="rm-denki">電気賃率</label>
          <input type="text" id="rm-denki" class="rate-master-num-input" inputmode="decimal" autocomplete="off" placeholder="0.000">
        </div>
        <div class="rate-master-field rate-master-field--setsubihi">
          <label for="rm-setsubihi">設備費賃率</label>
          <input type="text" id="rm-setsubihi" class="rate-master-num-input" inputmode="decimal" autocomplete="off" placeholder="0.000">
        </div>
        <div class="rate-master-field rate-master-field--tateya">
          <label for="rm-tateya">建屋</label>
          <input type="text" id="rm-tateya" class="rate-master-num-input" inputmode="decimal" autocomplete="off" placeholder="0.000">
        </div>
        <div class="rate-master-field rate-master-field--tochi">
          <label for="rm-tochi">土地</label>
          <input type="text" id="rm-tochi" class="rate-master-num-input" inputmode="decimal" autocomplete="off" placeholder="0.000">
        </div>
        <div class="rate-master-field rate-master-field--goukei">
          <label for="rm-sum-display">賃率計</label>
          <input type="text" id="rm-sum-display" class="rate-master-num-input" readonly tabindex="-1" aria-live="polite" value="0.000">
        </div>
      </div>
      <div class="rate-master-form-actions">
        <button type="button" id="rm-btn-save" class="rate-master-action-btn rate-master-action-btn-primary">保存</button>
        <button type="button" id="rm-btn-delete" class="rate-master-action-btn rate-master-action-btn-danger">削除</button>
      </div>
    </section>
  </main>

  <div id="rm-save-confirm-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="rm-save-confirm-title">
      <div class="search-dialog-head">
        <span id="rm-save-confirm-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message" id="rm-save-confirm-message">保存しますか？</p>
        <div class="search-dialog-actions">
          <button type="button" id="rm-save-confirm-yes" class="search-dialog-btn search-dialog-btn-primary">はい</button>
          <button type="button" id="rm-save-confirm-no" class="search-dialog-btn">いいえ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="rm-save-done-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="rm-save-done-title">
      <div class="search-dialog-head">
        <span id="rm-save-done-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">保存しました。</p>
        <div class="search-dialog-actions">
          <button type="button" id="rm-save-done-ok" class="search-dialog-btn search-dialog-btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>

  <div id="rm-delete-confirm-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="rm-delete-confirm-title">
      <div class="search-dialog-head">
        <span id="rm-delete-confirm-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message" id="rm-delete-confirm-message"></p>
        <div class="search-dialog-actions">
          <button type="button" id="rm-delete-confirm-yes" class="search-dialog-btn search-dialog-btn-primary">はい</button>
          <button type="button" id="rm-delete-confirm-no" class="search-dialog-btn">いいえ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="rm-delete-done-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="rm-delete-done-title">
      <div class="search-dialog-head">
        <span id="rm-delete-done-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">削除しました。</p>
        <div class="search-dialog-actions">
          <button type="button" id="rm-delete-done-ok" class="search-dialog-btn search-dialog-btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>


  <footer class="app-footer">
    <small>&copy; ARAISEIMITSU 2026 - Created By DIP Department</small>
  </footer>
  <script src="js/bridge.js"></script>
  <script src="js/page_common.js"></script>
  <script src="js/display_scale.js"></script>
  <script src="js/rate_master.js"></script>
</body>
</html>
