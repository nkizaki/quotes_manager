<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>段ボール箱マスタ編集</title>
  <link rel="icon" type="image/png" sizes="256x256" href="icons/icon.ico">
  <link rel="stylesheet" href="css/top.css">
  <link rel="stylesheet" href="css/design.css">
  <link rel="stylesheet" href="css/app-theme.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/dbox_master.css">
  <link rel="stylesheet" href="css/quotes.css">
  <script src="js/font_size_pref.js"></script>
  <script src="js/font_scale_boot.js"></script>
</head>
<body class="dbox-master-page">
  <header class="search-header ship-insp-header-bar dbox-master-header">
    <div class="search-header-inner ship-insp-sub-header-inner quotes-header-inner">
      <a href="edit_masters.html" class="ship-insp-back-btn">戻る</a>
      <h1 class="search-header-title dbox-master-title">段ボール箱マスタ編集</h1>
      <span class="search-header-version" id="app-version"></span>
      <span id="app-dev-badge" hidden style="color: red; font-weight: bold;">開発モード</span>
    </div>
  </header>

  <main class="dbox-master-main">
    <p id="dbox-master-message" class="dbox-master-message" aria-live="polite"></p>

    <div class="dbox-master-table-wrap">
      <table class="dbox-master-table" id="dbox-master-table">
        <colgroup>
          <col class="dbx-col dbx-col--id" />
          <col class="dbx-col dbx-col--spec" />
          <col class="dbx-col dbx-col--price" />
        </colgroup>
        <thead>
          <tr id="dbox-master-thead-row"></tr>
        </thead>
        <tbody id="dbox-master-tbody"></tbody>
      </table>
    </div>

    <section class="dbox-master-form-section" aria-labelledby="dbox-master-form-title">
      <h2 id="dbox-master-form-title" class="dbox-master-form-heading">入力・編集</h2>
      <div class="dbox-master-form-grid">
        <div class="dbox-master-field dbox-master-field--id">
          <label for="dbm-id">ID</label>
          <input type="text" id="dbm-id" autocomplete="off" placeholder="（新規時は空）">
        </div>
        <div class="dbox-master-field dbox-master-field--spec">
          <label for="dbm-spec">規格</label>
          <input type="text" id="dbm-spec" autocomplete="off">
        </div>
        <div class="dbox-master-field dbox-master-field--price">
          <label for="dbm-price">単価</label>
          <input type="text" id="dbm-price" class="dbox-master-dec1-input" inputmode="decimal" autocomplete="off" placeholder="0.0">
        </div>
      </div>
      <div class="dbox-master-form-actions">
        <button type="button" id="dbm-btn-save" class="dbox-master-action-btn dbox-master-action-btn-primary">保存</button>
        <button type="button" id="dbm-btn-delete" class="dbox-master-action-btn dbox-master-action-btn-danger">削除</button>
      </div>
    </section>
  </main>

  <div id="dbm-save-confirm-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="dbm-save-confirm-title">
      <div class="search-dialog-head">
        <span id="dbm-save-confirm-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message" id="dbm-save-confirm-message">保存しますか？</p>
        <div class="search-dialog-actions">
          <button type="button" id="dbm-save-confirm-yes" class="search-dialog-btn search-dialog-btn-primary">はい</button>
          <button type="button" id="dbm-save-confirm-no" class="search-dialog-btn">いいえ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dbm-save-done-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="dbm-save-done-title">
      <div class="search-dialog-head">
        <span id="dbm-save-done-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">保存しました。</p>
        <div class="search-dialog-actions">
          <button type="button" id="dbm-save-done-ok" class="search-dialog-btn search-dialog-btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dbm-delete-confirm-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="dbm-delete-confirm-title">
      <div class="search-dialog-head">
        <span id="dbm-delete-confirm-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message" id="dbm-delete-confirm-message"></p>
        <div class="search-dialog-actions">
          <button type="button" id="dbm-delete-confirm-yes" class="search-dialog-btn search-dialog-btn-primary">はい</button>
          <button type="button" id="dbm-delete-confirm-no" class="search-dialog-btn">いいえ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dbm-delete-done-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="dbm-delete-done-title">
      <div class="search-dialog-head">
        <span id="dbm-delete-done-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">削除しました。</p>
        <div class="search-dialog-actions">
          <button type="button" id="dbm-delete-done-ok" class="search-dialog-btn search-dialog-btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>


  <footer class="app-footer">
    <small>&copy; ARAISEIMITSU 2026 - Created By DIP Department</small>
  </footer>
  <script src="js/bridge.js"></script>
  <script src="js/page_common.js"></script>
  <script src="js/display_scale.js"></script>
  <script src="js/dbox_master.js"></script>
</body>
</html>
