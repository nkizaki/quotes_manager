<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>比重マスタ</title>
  <link rel="icon" type="image/png" sizes="256x256" href="icons/icon.ico">
  <link rel="stylesheet" href="css/top.css">
  <link rel="stylesheet" href="css/design.css">
  <link rel="stylesheet" href="css/app-theme.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/master_edit.css">
  <link rel="stylesheet" href="css/quotes.css">
  <script src="js/font_size_pref.js"></script>
  <script src="js/font_scale_boot.js"></script>
</head>
<body class="master-edit-page master-edit-page--gravity">
  <header class="search-header ship-insp-header-bar master-edit-header">
    <div class="search-header-inner ship-insp-sub-header-inner quotes-header-inner">
      <a href="edit_masters.html" class="ship-insp-back-btn">戻る</a>
      <h1 class="search-header-title master-edit-title">比重マスタ</h1>
      <span class="search-header-version" id="app-version"></span>
      <span id="app-dev-badge" hidden style="color: red; font-weight: bold;">開発モード</span>
    </div>
  </header>

  <main class="master-edit-main">
    <p id="master-edit-message" class="master-edit-message" aria-live="polite"></p>

    <div class="master-edit-table-wrap">
      <table class="master-edit-table" id="master-edit-table">
        <thead>
          <tr id="master-edit-thead-row"></tr>
        </thead>
        <tbody id="master-edit-tbody"></tbody>
      </table>
    </div>

    <section class="master-edit-form-section" aria-labelledby="master-edit-form-title">
      <h2 id="master-edit-form-title" class="master-edit-form-heading">入力・編集</h2>
      <div class="master-edit-form-grid">
        <div class="master-edit-field master-edit-field--narrow">
          <label for="me-id">ID</label>
          <input type="text" id="me-id" autocomplete="off" placeholder="（新規時は空）">
        </div>
        <div class="master-edit-field master-edit-field--wide">
          <label for="me-name">名称</label>
          <input type="text" id="me-name" autocomplete="off">
        </div>
        <div class="master-edit-field master-edit-field--narrow">
          <label for="me-gravity">比重</label>
          <input type="text" id="me-gravity" autocomplete="off" inputmode="decimal">
        </div>
      </div>
      <div class="master-edit-form-actions">
        <button type="button" id="me-btn-save" class="master-edit-action-btn master-edit-action-btn-primary">保存</button>
        <button type="button" id="me-btn-delete" class="master-edit-action-btn master-edit-action-btn-danger">削除</button>
      </div>
    </section>
  </main>

  <div id="me-save-confirm-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="me-save-confirm-title">
      <div class="search-dialog-head">
        <span id="me-save-confirm-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message" id="me-save-confirm-message">保存しますか？</p>
        <div class="search-dialog-actions">
          <button type="button" id="me-save-confirm-yes" class="search-dialog-btn search-dialog-btn-primary">はい</button>
          <button type="button" id="me-save-confirm-no" class="search-dialog-btn">いいえ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="me-save-done-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="me-save-done-title">
      <div class="search-dialog-head">
        <span id="me-save-done-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">保存しました。</p>
        <div class="search-dialog-actions">
          <button type="button" id="me-save-done-ok" class="search-dialog-btn search-dialog-btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>

  <div id="me-delete-confirm-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="me-delete-confirm-title">
      <div class="search-dialog-head">
        <span id="me-delete-confirm-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message" id="me-delete-confirm-message"></p>
        <div class="search-dialog-actions">
          <button type="button" id="me-delete-confirm-yes" class="search-dialog-btn search-dialog-btn-primary">はい</button>
          <button type="button" id="me-delete-confirm-no" class="search-dialog-btn">いいえ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="me-delete-done-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="me-delete-done-title">
      <div class="search-dialog-head">
        <span id="me-delete-done-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">削除しました。</p>
        <div class="search-dialog-actions">
          <button type="button" id="me-delete-done-ok" class="search-dialog-btn search-dialog-btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <small>&copy; ARAISEIMITSU 2026 - Created By DIP Department</small>
  </footer>
  <script src="js/bridge.js"></script>
  <script src="js/page_common.js"></script>
  <script src="js/display_scale.js"></script>
  <script>
    window.MASTER_EDIT_CONFIG = {
      apiBase: '/api/gravity_master',
      uniqueKey: 'ID',
      uniqueAuto: true,
      fields: [
        { key: 'ID', id: 'me-id' },
        { key: '名称', id: 'me-name' },
        { key: '比重', id: 'me-gravity' }
      ],
      deleteExtraKeys: ['名称']
    };
  </script>
  <script src="js/master_save_error.js"></script>
  <script src="js/master_edit.js"></script>
</body>
</html>
