<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>実績集計</title>
  <link rel="icon" type="image/png" sizes="256x256" href="icons/icon.ico">
  <link rel="stylesheet" href="css/top.css">
  <link rel="stylesheet" href="css/design.css">
  <link rel="stylesheet" href="css/app-theme.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/quotes.css">
  <link rel="stylesheet" href="css/results_summary.css">
  <script src="js/font_size_pref.js"></script>
  <script src="js/font_scale_boot.js"></script>
</head>
<body class="search-page results-summary-page">
  <header class="search-header ship-insp-header-bar">
    <div class="search-header-inner ship-insp-sub-header-inner quotes-header-inner">
      <a href="quotes.html" class="ship-insp-back-btn">戻る</a>
      <h1 class="search-header-title">実績集計</h1>
      <span class="search-header-version" id="app-version"></span>
      <span id="app-dev-badge" hidden style="color: red; font-weight: bold;">開発モード</span>
    </div>
  </header>

  <main class="search-main">
    <section class="search-section results-summary-section">
      <div class="results-summary-filter">
        <label for="submission-date-from">提出日</label>
        <div class="results-summary-date-range">
          <input type="date" id="submission-date-from" name="submission_date_from" autocomplete="off">
          <span class="results-summary-date-sep" aria-hidden="true">～</span>
          <input type="date" id="submission-date-to" name="submission_date_to" autocomplete="off">
        </div>
        <button type="button" id="results-summary-btn" class="search-btn">集計</button>
        <span id="results-summary-loading" class="btn-loading" hidden>
          <span class="progress-spinner" aria-hidden="true"></span>
        </span>
      </div>

      <div class="results-summary-tables">
        <div class="results-summary-table-block">
          <p class="results-summary-table-label">管理No単位の件数</p>
          <div class="results-summary-table-wrap">
            <table class="results-summary-table" id="mgmt-no-table">
              <thead>
                <tr>
                  <th scope="col">営業担当</th>
                  <th scope="col">件数</th>
                </tr>
              </thead>
              <tbody id="mgmt-no-tbody"></tbody>
            </table>
          </div>
        </div>

        <div class="results-summary-table-block">
          <p class="results-summary-table-label">見積りID単位の件数</p>
          <div class="results-summary-table-wrap">
            <table class="results-summary-table" id="quote-id-table">
              <thead>
                <tr>
                  <th scope="col">営業担当</th>
                  <th scope="col">点数</th>
                </tr>
              </thead>
              <tbody id="quote-id-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="alert-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="alert-title">
      <div class="search-dialog-head">
        <span id="alert-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p id="alert-message" class="search-dialog-message"></p>
        <div class="search-dialog-actions">
          <button type="button" id="alert-ok" class="search-dialog-btn search-dialog-btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <small>&copy; ARAISEIMITSU 2026 - Created By DIP Department</small>
  </footer>
  <script src="js/bridge.js"></script>
  <script src="js/page_common.js"></script>
  <script src="js/display_scale.js"></script>
  <script src="js/results_summary.js"></script>
</body>
</html>
