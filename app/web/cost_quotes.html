<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>原価見積り管理</title>
  <link rel="icon" type="image/png" sizes="256x256" href="icons/icon.ico">
  <link rel="stylesheet" href="css/top.css">
  <link rel="stylesheet" href="css/design.css">
  <link rel="stylesheet" href="css/app-theme.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/cost_quotes_search.css">
  <link rel="stylesheet" href="css/quotes.css">
  <script src="js/font_size_pref.js"></script>
  <script src="js/font_scale_boot.js"></script>
</head>
<body class="search-page">
  <header class="search-header ship-insp-header-bar">
    <div class="search-header-inner ship-insp-sub-header-inner quotes-header-inner">
      <a href="index.html" class="ship-insp-back-btn">戻る</a>
      <h1 class="search-header-title">原価見積り管理</h1>
      <span class="search-header-version" id="app-version"></span>
      <span id="app-dev-badge" hidden style="color: red; font-weight: bold;">開発モード</span>
    </div>
  </header>

  <main class="search-main">
    <section class="search-section">
      <div class="search-form-grid">
        <div class="search-form-item">
          <label for="sales-select">営業担当</label>
          <select id="sales-select" name="営業担当">
            <option value="">選択してください</option>
            <option value=""></option>
          </select>
        </div>
        <div class="search-form-item">
          <label for="customer-select">客先名</label>
          <select id="customer-select" name="客先名">
            <option value="">選択してください</option>
            <option value=""></option>
          </select>
        </div>
        <div class="search-form-item">
          <label for="hinban">品番</label>
          <input type="text" id="hinban" name="品番" value="" placeholder="">
        </div>
        <div class="search-form-item">
          <label for="hinmei">品名</label>
          <input type="text" id="hinmei" name="品名" value="" placeholder="">
        </div>
        <div class="search-form-item">
          <label for="genka-id">原価見積りID</label>
          <input type="text" id="genka-id" name="原価見積りID" value="" placeholder="">
        </div>
      </div>
      <div class="search-actions">
        <button type="button" id="search-btn" class="search-btn">検索</button>
        <button type="button" id="search-new-btn" class="search-new-btn">新規</button>
      </div>
    </section>

    <section id="result-area" class="search-section">
      <div class="search-result-status">
        <p id="result-message" class="search-result-message">検索結果：</p>
        <span id="search-loading" class="btn-loading" hidden>
          <span class="progress-spinner" aria-hidden="true"></span>
        </span>
      </div>
    <div id="result-table-wrapper">
      <table id="result-table">
        <colgroup>
          <col class="result-table-col-1">
          <col class="result-table-col-2">
          <col class="result-table-col-3">
          <col class="result-table-col-4">
          <col class="result-table-col-5">
          <col class="result-table-col-6">
          <col class="result-table-col-7">
        </colgroup>
        <thead id="result-thead">
          <tr>
            <th>原価見積りID</th>
            <th>管理NO</th>
            <th>営業担当</th>
            <th>客先名</th>
            <th>品番</th>
            <th>品名</th>
            <th>備考</th>
          </tr>
        </thead>
        <tbody id="result-tbody"></tbody>
      </table>
    </div>
    </section>
  </main>

  <div id="search-subwindow-overlay" class="search-subwindow-overlay" aria-hidden="true" hidden>
    <div class="search-subwindow-panel" role="dialog" aria-modal="true" aria-labelledby="search-subwindow-title">
      <div class="search-subwindow-head">
        <span id="search-subwindow-title" class="search-subwindow-title">新規</span>
        <button type="button" id="search-subwindow-close" class="search-subwindow-close" aria-label="閉じる">×</button>
      </div>
      <div class="search-subwindow-body">
        <form id="search-new-form" class="search-subwindow-form" novalidate>
          <div class="search-subwindow-form-columns">
            <div class="search-subwindow-form-grid">
              <div class="search-form-item">
                <label for="new-sales-select">営業担当<span class="required-mark" aria-hidden="true">*</span></label>
                <select id="new-sales-select" name="new_sales_code" autocomplete="off">
                  <option value="">選択してください</option>
                  <option value=""></option>
                </select>
              </div>
              <div class="search-form-item">
                <label for="new-kanri-no">管理NO<span class="required-mark" aria-hidden="true">*</span></label>
                <input type="text" id="new-kanri-no" name="new_kanri_no" value="" autocomplete="off">
              </div>
              <div class="search-form-item">
                <label for="new-customer-select">客先名<span class="required-mark" aria-hidden="true">*</span></label>
                <select id="new-customer-select" name="new_customer_code" autocomplete="off">
                  <option value="">選択してください</option>
                  <option value=""></option>
                </select>
              </div>
              <div class="search-form-item">
                <label for="new-hinban">品番<span class="required-mark" aria-hidden="true">*</span></label>
                <input type="text" id="new-hinban" name="new_hinban" value="" autocomplete="off">
              </div>
              <div class="search-form-item">
                <label for="new-hinmei">品名</label>
                <input type="text" id="new-hinmei" name="new_hinmei" value="" autocomplete="off">
              </div>
            </div>
            <div class="search-form-item search-subwindow-bikou">
              <label for="new-bikou">備考</label>
              <textarea id="new-bikou" name="new_bikou" rows="5" autocomplete="off" placeholder=""></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="search-subwindow-actions">
        <div id="search-subwindow-footer-new" class="search-subwindow-footer-group">
          <button type="button" id="search-new-register-btn" class="search-register-btn" form="search-new-form">登録</button>
        </div>
        <div id="search-subwindow-footer-edit" class="search-subwindow-footer-group" hidden>
          <button type="button" id="search-edit-save-btn" class="search-register-btn" form="search-new-form">変更</button>
          <button type="button" id="search-edit-delete-btn" class="search-delete-btn" form="search-new-form">削除</button>
        </div>
      </div>
    </div>
  </div>

  <div id="register-confirm-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="register-confirm-title">
      <div class="search-dialog-head">
        <span id="register-confirm-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">登録しますか？</p>
        <div class="search-dialog-actions">
          <button type="button" id="register-confirm-yes" class="search-dialog-btn search-dialog-btn-primary">はい</button>
          <button type="button" id="register-confirm-no" class="search-dialog-btn">いいえ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="register-done-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="register-done-title">
      <div class="search-dialog-head">
        <span id="register-done-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">登録しました</p>
        <div class="search-dialog-actions">
          <button type="button" id="register-done-ok" class="search-dialog-btn search-dialog-btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>

  <div id="delete-confirm-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="delete-confirm-title">
      <div class="search-dialog-head">
        <span id="delete-confirm-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">削除してよろしいですか？</p>
        <div class="search-dialog-actions">
          <button type="button" id="delete-confirm-yes" class="search-dialog-btn search-dialog-btn-primary">はい</button>
          <button type="button" id="delete-confirm-no" class="search-dialog-btn">いいえ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="delete-done-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="delete-done-title">
      <div class="search-dialog-head">
        <span id="delete-done-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">削除しました。</p>
        <div class="search-dialog-actions">
          <button type="button" id="delete-done-ok" class="search-dialog-btn search-dialog-btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>

  <div id="update-confirm-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="update-confirm-title">
      <div class="search-dialog-head">
        <span id="update-confirm-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">内容を更新しますか？</p>
        <div class="search-dialog-actions">
          <button type="button" id="update-confirm-yes" class="search-dialog-btn search-dialog-btn-primary">はい</button>
          <button type="button" id="update-confirm-no" class="search-dialog-btn">いいえ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="update-done-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="update-done-title">
      <div class="search-dialog-head">
        <span id="update-done-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p class="search-dialog-message">更新しました。</p>
        <div class="search-dialog-actions">
          <button type="button" id="update-done-ok" class="search-dialog-btn search-dialog-btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>

  <div id="alert-overlay" class="search-dialog-overlay" aria-hidden="true" hidden>
    <div class="search-dialog-panel" role="alertdialog" aria-modal="true" aria-labelledby="alert-title">
      <div class="search-dialog-head">
        <span id="alert-title" class="search-dialog-title">確認</span>
      </div>
      <div class="search-dialog-body">
        <p id="alert-message" class="search-dialog-message"></p>
        <div class="search-dialog-actions">
          <button type="button" id="alert-ok" class="search-dialog-btn search-dialog-btn-primary">OK</button>
        </div>
      </div>
    </div>
  </div>


  <footer class="app-footer">
    <small>&copy; ARAISEIMITSU 2026 - Created By DIP Department</small>
  </footer>
  <script src="js/bridge.js"></script>
  <script src="js/page_common.js"></script>
  <script src="js/display_scale.js"></script>
  <script src="js/search_boot.js"></script>
</body>
</html>
